<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подарки - 6 months</title>
    <link rel="stylesheet" href="style_osnova.css">
    <link rel="stylesheet" href="style_fonts.css">
    <link rel="icon" type="image/x-icon" href="favicon-16x16.png">
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link rel="apple-touch-icon" href="favicon_io/apple-touch-icon.png">
    <style>
        .gift-content {
            max-width: 800px;
            margin: 50px auto;
            padding: 0 20px;
            color: #fff;
            line-height: 1.8;
        }
        
        .gift-text {
            font-size: 18px;
            white-space: pre-line;
            background: #111;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #fff;
            text-decoration: none;
            border: 1px solid #fff;
            padding: 10px 20px;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html" style="color: inherit; text-decoration: none;">6 months</a>
            </div>
            <div class="nav-links">
                <a href="bag.html">Корзина (<span id="cart-count">0</span>)</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="gift-content">
            <div class="gift-text">
ладно ладно наверное уже хватит посмотри на втором этаже в корридоре где то ну вот кароче да
            </div>
    </main>

   <div class="footer-bottom">
            <p>&copy; 2025 6 months. Все права защищены.</p>
            <p>Одежда ручной работы</p>
        </div>
    </footer>

    <script>
        // Обновляем счетчик корзины
        document.addEventListener('DOMContentLoaded', function() {
            const cart = JSON.parse(localStorage.getItem('cart_guest')) || [];
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            const cartCounter = document.getElementById('cart-count');
            if (cartCounter) {
                cartCounter.textContent = totalItems;
            }
        });
    </script>
</body>
</html>
