<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - 6 months</title>
    <link rel="stylesheet" href="style_fonts.css">
    <link rel="stylesheet" href="style_bag.css">
    <link rel="icon" type="image/x-icon" href="favicon-16x16.png">
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html" class="logo-link">6 months</a>
            </div>
            <div class="nav-links">
                <a href="bag.html">Корзина (<span id="cart-count">0</span>)</a>
            </div>
        </nav>
    </header>

    <div class="cart-page">
        <h1>Корзина</h1>
        
        <!-- Контейнер для товаров -->
        <div id="cart-items">
            <!-- Товары будут добавляться динамически -->
        </div>
        
        <!-- Блок с итоговой суммой -->
        <div id="cart-total">
            <!-- Сумма будет добавляться динамически -->
        </div>
        
        <!-- Кнопка очистки -->
        <button id="clear-cart" class="clear-cart-btn">Очистить корзину</button>
        
        <!-- Форма оформления заказа -->
        <form id="checkout-form">
            <h3>Контактные данные</h3>
            <input type="text" id="contact" placeholder="Ваш Telegram @username или телефон" required>
            <small>Пример: @username или +79991234567</small>
            
            <button type="submit" class="checkout-btn">
                Оформить заказ
            </button>
        </form>
        
        <!-- Выпадающий блок информации -->
        <div class="info-dropdown">
            <button class="info-dropdown-btn" >
                <span>Информация о заказе</span>
                <span class="arrow">▼</span>
            </button>
            
            <div class="info-dropdown-content" id="info-content">
                <div class="order-info">
                    <p>Заказы обрабатываются вручную</p>
                    <p>Свяжемся с вами в Telegram для уточнения деталей</p>
                    <p>Доставка рассчитывается индивидуально</p>
                    <p>Время ответа: 10-15 минут в рабочее время</p>
                    <p>Для связи: @SKIANORAK</p>
                </div>
            </div>
        </div>
    </div>

    <script src="machine_bag.js"></script>
</body>
</html>
